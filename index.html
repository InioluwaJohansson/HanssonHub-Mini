<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HanssonHub</title>
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme & Color Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Mobile security hub for monitoring doors, cameras, and chats." />

    <!-- Android & Mobile Chrome Standalone Capability -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="HanssonHub" />

    <!-- Apple iOS Safari Standalone Capability -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HanssonHub" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Favicons & App Icons (Shield with White Border and H on Black) -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="shortcut icon" href="/icons/favicon-32x32.png" />
  </head>
  <body class="bg-zinc-950 text-slate-100 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
